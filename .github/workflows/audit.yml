name: AERO Одит-робот
on:
  schedule:
    # 🔴 О10 · CRON Е ВИНАГИ UTC. Часовете долу са ЛЯТНО софийско (UTC+3);
    # зиме (UTC+2) всеки слот идва ЧАС ПО-РАНО. GitHub няма часова зона в cron,
    # затова е неизбежно — но коментарът вече не лъже.
    - cron: '0 2 * * 1-5'     # 05:00 лято / 04:00 зима София — Азия
    - cron: '0 4 * * 1-5'     # 07:00 София — рано, преди европейската сесия
    - cron: '0 6 * * 1-5'     # 09:00 София — сутрин, с утринния пулс
    - cron: '0 9 * * 1-5'     # 12:00 София — обед
    - cron: '0 12 * * 1-5'    # 15:00 София — рано сутрин преди Ню Йорк
    - cron: '0 15 * * 1-5'    # 18:00 София — следобед
    - cron: '30 18 * * 1-5'   # 21:30 София — вечер, след равносметката
  workflow_dispatch:
# О10 · без това два едновременни ръна дават ДУБЛИРАН отчет в чата.
concurrency:
  group: aero-audit
  cancel-in-progress: false
permissions:
  contents: read
  actions: write            # ОДИТ-51: одитът връща жеста и буди бота
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # ОДИТ-9 (A3): плитък чекаут дава 0 комита →
                                # В5 «сърцето на одита» реконструира нула сделки и
                                # мълчи. С пълната история проверката оживява.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt pyyaml
      - name: run audit robot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003827523037"
        # ОДИТ-19 · СЪЖИВЯВАНЕ: два опита, преди да се говори за падане
        run: |
          python audit_bot.py --repo . --code . --send && exit 0
          echo "::warning::първият опит не мина — чакам 30с"
          sleep 30
          python audit_bot.py --repo . --code . --send
      # 🔴 ОДИТ-51 · ВЗАИМЕН БУДИЛНИК. Дотук ботът будеше одита, но не обратното —
      # значи спре ли ботът, спира и единственото нещо, което би забелязало.
      # Мерено на живо: дупка от 447 минути на 06.08, която НИКОЙ не видя.
      # Прагът 25 мин е пет пъти нормалния интервал → не стреля на дребно закъснение.
      - name: wake the bot
        if: always()
        continue-on-error: true          # будилникът НИКОГА не вали одита
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/aero-bot.yml/runs?per_page=1" \
            | grep -o '"created_at": *"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          if [ -z "$LAST" ]; then echo "няма история на бота — не будя"; exit 0; fi
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 60 ))
          echo "последен рън на бота: $LAST (преди ${AGE} мин)"
          # пазарът затворен ли е → мълчи (същият прозорец като в бота)
          DOW=$(date -u +%u); HH=$(date -u +%H)
          if [ "$DOW" = "6" ] || { [ "$DOW" = "5" ] && [ "$HH" -ge 21 ]; } \
             || { [ "$DOW" = "7" ] && [ "$HH" -lt 21 ]; }; then
            echo "пазарът е затворен — не будя"; exit 0
          fi
          if [ "$AGE" -lt 25 ]; then echo "бягал е преди ${AGE} мин — не го будя"; exit 0; fi
          echo "🔔 ботът мълчи от ${AGE} мин — будя го"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/aero-bot.yml/dispatches" \
            -d '{"ref":"main"}' -w "HTTP %{http_code}\n"
      - name: log failure                               # ОДИТ-21: БЕЗ съобщение в Телеграм
        if: failure()
        # Одит-роботът е ИНСТРУМЕНТ ЗА ПРОВЕРКА, не част от търговията. Падне ли,
        # собственикът не може да направи нищо и не губи сделки. Остава в лога.
        # Отчетът, който той поиска «хубав и готин», си върви нормално по-горе.
        run: echo "::warning::одит-роботът не успя и двата пъти — виж лога (без съобщение, по избор на собственика)"
