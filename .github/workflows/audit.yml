name: AERO Одит-робот
on:
  schedule:
    - cron: '0 2 * * 1-5'     # 05:00 София — по време на Азия
    - cron: '0 4 * * 1-5'     # 07:00 София — рано, преди европейската сесия
    - cron: '0 6 * * 1-5'     # 09:00 София — сутрин, с утринния пулс
    - cron: '0 9 * * 1-5'     # 12:00 София — обед
    - cron: '0 12 * * 1-5'    # 15:00 София — рано сутрин преди Ню Йорк
    - cron: '0 15 * * 1-5'    # 18:00 София — следобед
    - cron: '30 18 * * 1-5'   # 21:30 София — вечер, след равносметката
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # ОДИТ-9 (A3): плитък чекаут дава 0 комита →
                                # В5 «сърцето на одита» реконструира нула сделки и
                                # мълчи. С пълната история проверката оживява.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt pyyaml
      - name: run audit robot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003827523037"
        # ОДИТ-19 · СЪЖИВЯВАНЕ: два опита, преди да се говори за падане
        run: |
          python audit_bot.py --repo . --code . --send && exit 0
          echo "::warning::първият опит не мина — чакам 30с"
          sleep 30
          python audit_bot.py --repo . --code . --send
      - name: alarm on failure                          # W4: ако роботът падне — кажи го
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003827523037"
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=HTML \
            -d text="🛠 <i>Одит-роботът не успя да направи отчета този път (опитах два пъти). Ботът си работи — това е само проверката. Следващият отчет е след няколко часа.</i>" || true
