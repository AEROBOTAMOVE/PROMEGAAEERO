          # шапка в този чат → отговор с reply → клиентът вижда поддръжка.
          # НАЗАД: SUPPORT_RELAY=0 → ботът е дословно като преди v18.84.
          ПОДДРЪЖКА: ${{ vars.SUPPORT_RELAY || '' }}
          # 🔴 ОТДЕЛЕН чат за поддръжката · НИКОГА каналът със сигналите
          ПОДДРЪЖКА_ЧАТ: ${{ vars.SUPPORT_CHAT || '' }}
          ПОДДРЪЖКА_ТАВАН: ${{ vars.SUPPORT_MAX_PER_RUN || '' }}
          ПОДДРЪЖКА_ЗНАЦИ: ${{ vars.SUPPORT_MAX_CHARS || '' }}
          ПОДДРЪЖКА_ОПИТИ: ${{ vars.SUPPORT_RETRIES || '' }}
          # кой може да отговаря на клиентите · празно = всеки от чата на бота
          ПОДДРЪЖКА_ОТ: ${{ vars.SUPPORT_FROM || '' }}
          # 🔴 16.09 · редът «От 08.09 досега» във вечерната карта · 0 го маха
          ЗАПИС_РЕД: ${{ vars.RECORD_LINE || '' }}
          ЗАПИС_ОТ: ${{ vars.RECORD_FROM || '' }}
          ИМЕ_ДНИ: ${{ vars.BOT_NAME_DAYS || '' }}
          ВХОД_НУЛИРАЙ: ${{ vars.INPUT_RESET || '' }}
          НОВИНИ_ВСИЧКИ: ${{ vars.NEWS_ALL_SLOTS || '' }}
          РАВНОСМЕТКА_ВСИЧКИ: ${{ vars.RECAP_ALL_SLOTS || '' }}
          НОВИНИ_FOMC_МИН: ${{ vars.NEWS_FOMC_MIN || '' }}
          КАЛЕНДАР_ПАЗАЧ: ${{ vars.CALENDAR_GUARD || '' }}
          СМЕТКА_ТОРБА: ${{ vars.BAG_SUM || '' }}
          СИГНАЛ_ЯСЕН: ${{ vars.SIGNAL_CLEAR || '' }}
          КАНАЛ_САМО_ВАЖНОТО: ${{ vars.CHANNEL_ESSENTIAL || '' }}
          # 🔴 15.09 · ПУБЛИЧЕН КАНАЛ: в Телеграм само сутрешната прогноза, всичко
          # друго — платформата. НАЗАД: PUBLIC_CHANNEL=0 (или празно).
          КАНАЛ_ПУБЛИЧЕН: ${{ vars.PUBLIC_CHANNEL || '' }}
          PLATFORMA_URL: ${{ vars.PLATFORM_URL || '' }}
          НЕ_ГОНИ: ${{ vars.NO_CHASE || '' }}
          ЕДИН_ВХОД: ${{ vars.ONE_ENTRY || '' }}
          БЕЗ_НАСРЕЩНИ: ${{ vars.NO_OPPOSITE || '' }}
          ЗЛАТЕН_ПЪТ: ${{ vars.GOLD_PATH || '' }}
          ЗЛАТЕН_ПЪТ_МИН: ${{ vars.GOLD_PATH_MIN || '' }}
          ЗЛАТЕН_ПЪТ_ОТМ_МАКС: ${{ vars.GOLD_PATH_OFFSET_MAX || '' }}
          # 🔴 08.09 · БАЗИСЪТ НА БАРА, НЕ НА РЪНA. Барът от 11:10 се съди
          # чак в 11:27, а базисът дотогава е мръднал 2.8$ — точно колкото
          # да изяде цел. НАЗАД: BASIS_HIST=0.
          БАЗИС_ИСТОРИЯ: ${{ vars.BASIS_HIST || '' }}
          БАЗИС_ИСТ_МАКС: ${{ vars.BASIS_HIST_MAX || '' }}
          БАЗИС_ИСТ_ПРОЗОРЕЦ: ${{ vars.BASIS_HIST_WINDOW || '' }}
          # 🔴 08.09 · ЦЕЛИТЕ НА ЛОНГА КАТО КРАТНИ НА РИСКА. ИЗКЛЮЧЕНА.
          # Живо е стоп 130 с цели 75/120/200 = 0.58R/0.92R/1.54R. Първата
          # цел е под ПОЛОВИН риск. Мерено на 64 затворени сделки: средна
          # печалба +83 п, средна загуба -145 п, за нула трябват 64% победи,
          # ботът прави 61%. Не греши посоката - геометрията губи.
          # ВКЛЮЧВАНЕ: TARGETS_IN_R = 1.0,1.5,2.0  (при стоп 130 -> 130/195/260)
          # ИЗКЛЮЧВАНЕ: TARGETS_IN_R = 0
          ЦЕЛИ_В_R: ${{ vars.TARGETS_IN_R || '' }}
          # ══════════════════════════════════════════════════════════
          # 🔴🔴🔴 23.09 · v18.90 · «ГЛАСЪТ И КАНАЛЪТ» · шест лоста САМО по
          # ДУМИТЕ. Нито един не пипа РЕШЕНИЕ: вход, стоп, цели, гейт,
          # пазачи, «не гони» и следенето са дословно v18.89. Мени се само
          # какво КАЗВА ботът и КЪДЕ го казва.
          # Източник: ОДИТ_ДУМИТЕ_22-09.md — 3 462 истински карти.
          # ══════════════════════════════════════════════════════════
          # Парите до пипсове са при ИСТИНСКИЯ лот. 2 515 от 2 516 доларови
          # числа в дневника бяха НА УНЦИЯ, тоест клиентът четеше риск 20
          # пъти по-малък («стоп −130 пипса (−13.00$)» при истински −260 $).
          # НАЗАД: MONEY_EVERYWHERE=0.
          ПАРИ_ВСЯКЪДЕ: ${{ vars.MONEY_EVERYWHERE || '' }}
          # Нито една дума за бъдещето: «нова карта идва» 127 · «чакам нов
          # сигнал» 209 · «пиша щом падне спирачката» 412 · «очаквам между»
          # 10 · «оттук без риск» 342. НАЗАД: NO_PROMISES=0.
          БЕЗ_ОБЕЩАНИЯ: ${{ vars.NO_PROMISES || '' }}
          # Една позиция, един лот на едно място, едно мнение на рън
          # («📦 2 позиции» 59 пъти · «ПРИБЕРИ … в джоба» 212 пъти).
          # НАЗАД: ONE_LAW=0.
          ЕДИН_ЗАКОН: ${{ vars.ONE_LAW || '' }}
          # Без реда, който обяснява предишния ред (171 пъти) · 58 емоджита
          # → 12 със значение · без латиница. НАЗАД: CLEAN_TEXT=0.
          ЧИСТ_ТЕКСТ: ${{ vars.CLEAN_TEXT || '' }}
          # СЕГА · СЛУЧВА СЕ · НАКЪДЕ · ЗНАНИЕ, с подлог ПАЗАРЪТ, не машината.
          # НАЗАД: FOUR_LINES=0.
          ЧЕТИРИ_РЕДА: ${{ vars.FOUR_LINES || '' }}
          # 🔴 ИЗКЛЮЧЕН ПО ПОДРАЗБИРАНЕ, НАРОЧНО. Включен, каналът дава ТРИ
          # съобщения на ден (прогнозата на деня + сутрешната и вечерната
          # карта за публиката), а всичко друго отива САМО на платформата.
          # Платформата още не е качена — спре ли се каналът днес, клиентите
          # остават без нищо. Пуска се с ЕДНА променлива: CHANNEL_MODE=1.
          # НАЗАД: CHANNEL_MODE=0.
          КАНАЛ_РЕЖИМ: ${{ vars.CHANNEL_MODE || '' }}
          # Таванът в знаци при четирите реда. Пазачът на тавана НЕ реже —
          # той мери и записва в дневника. НАЗАД: CARD_CHARS_4=440.
          КАРТА_ЗНАЦИ_4: ${{ vars.CARD_CHARS_4 || '' }}
          # Прозорецът на прогнозата по София (часът с най-много живот).
          # НАЗАД: FORECAST_HOUR_FROM=9 · FORECAST_HOUR_TO=10.
          ПРОГНОЗА_ЧАС_ОТ: ${{ vars.FORECAST_HOUR_FROM || '' }}
          ПРОГНОЗА_ЧАС_ДО: ${{ vars.FORECAST_HOUR_TO || '' }}
        # ОДИТ-19 · СЪЖИВЯВАНЕ. Повечето падания са мигновени (мрежа, 429 от Yahoo,
        # бавен фийд). Дотук едно мигване вдигаше червена аларма. Сега се пробва ПАК.
        run: |
          for try_n in 1 2 3; do
            if python live_bot.py --send --stats backtest_stats.json --out live; then
              [ "$try_n" != "1" ] && echo "::notice::ботът тръгна от опит $try_n"
              exit 0
            fi
            echo "::warning::опит $try_n не мина — чакам 20с и пробвам пак"
            sleep 20
          done
          echo "::error::и трите опита паднаха"
          exit 1
      # 🔴🔴 09.09 · НОВИНИТЕ · Б7. Панелът `novini_zhivi.js` е готов от
      # 08.09 и чака `live/novini.json`; събирачът също е готов и никога
      # не беше закачан. Двете половини на едно нещо не се срещаха.
      # Пуснат живо: 11 източника, 0 паднали, 200 новини, 66 важни.
      #
      # `continue-on-error` е НАРОЧНО: паднала емисия не бива да спира
      # сигнал за истински пари. Новината е добавка, не условие.
      #
      # `--na-vseki 30` е спирачка за честотата: ботът тръгва на 5 минути,
      # тоест 288 пъти дневно по 11 емисии = над 3000 заявки към всеки
      # чужд сайт НА ДЕН. Yahoo вече е връщал 429 на този бот.
      # Новините не остаряват за пет минути.
      #
      # Стои ПРЕДИ «save state», за да влезе в същия комит.
      - name: novini
        continue-on-error: true
        timeout-minutes: 3
        run: python novini_sbirach.py live --na-vseki 30
      - name: save state
        if: always()
        timeout-minutes: 6          # ОДИТ-2 №4: ботът вече излиза с код 1 при краш —
                              # състоянието ТРЯБВА да се запише и тогава (иначе двойна карта)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003827523037"
          CHECKOUT_TIP: ${{ vars.CHECKOUT_TIP || '' }}
        run: |
          git config user.name "aero-bot"
          git config user.email "bot@users.noreply.github.com"
          # 🔴 15.09 · ОПАШКИТЕ ЗА ПЛАТФОРМАТА. Телефонът на клиента теглеше
          # целия дневник (8,2 MB) на всеки 5 мин за един нов ред. Range не
          # може (CORS). Малките опашки се сливат с кеша в платформата.
          # НАЗАД: изтриване на двата реда — платформата пада на целите файлове.
          tail -n 120 live/live_journal.jsonl > live/live_journal_opashka.jsonl 2>/dev/null || true
          tail -n 400 live/brain_journal.jsonl > live/brain_journal_opashka.jsonl 2>/dev/null || true
          git add -A live/ || true
          git commit -m "state" || echo "nothing"
          ok=0
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && ok=1 && break
            # 🔴 22.09 · v18.88 · конфликтът при rebase оставяше «unmerged files» и
            # опити 2 и 3 падаха сигурно — абортът връща чистото дърво за следващия.
            # НАЗАД: CHECKOUT_TIP=0.
            if [ "$CHECKOUT_TIP" != "0" ]; then git rebase --abort 2>/dev/null || true; fi
            echo "push опит $i неуспешен, чакам 5с"; sleep 5
          done
          if [ "$ok" != "1" ]; then
            # ОДИТ-21: БЕЗ СЪОБЩЕНИЕ. Собственикът не може да направи нищо по
            # неуспешен git push — това е мой проблем, не негов. Остава в лога;
            # одит-роботът и без това следи за двойни карти (М-групата).
            echo "::warning::PUSH FAILED - състоянието не се записа (без съобщение, по избор на собственика)"
          fi
      # ═══ ОДИТ-6: БУДИЛНИК ЗА ОДИТ-РОБОТА ═══
      # Мерено 04.08.2026 през API-то: одитът има 7 крона на ден, но реалните пускания
      # закъсняват +227, +108, +82 мин, а на 04.08 до обед НЕ Е СЕ ПУСНАЛ НИТО ВЕДНЪЖ.
      # Шест от седемте крона стоят на КРЪГЪЛ ЧАС — точно когато GitHub изхвърля
      # разписания. Ботът обаче тръгва надеждно (12/12 ръна). Затова ТОЙ го буди:
      # ако сме в целеви час по София и одитът не е бягал в последните 50 мин → dispatch.
      # Не пипа самия одит-робот; кроновете му остават като втори колан.
      - name: wake the audit robot
        if: always()
        continue-on-error: true          # будилникът НИКОГА не бива да вали сигналния рън
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # НЕ ползваме `TZ=Europe/Sofia date` — мерено: в среда без tzdata връща UTC
          # мълчаливо и будилникът щеше да стреля 3 часа по-рано. Ползваме СЪЩИЯ метод
          # като самия бот (zoneinfo), който доказано дава верния час на картите.
          SOF=$(python -c "from zoneinfo import ZoneInfo
          from datetime import datetime, timezone
          print(datetime.now(timezone.utc).astimezone(ZoneInfo('Europe/Sofia')).strftime('%H %M'))" 2>/dev/null || true)
          H=${SOF%% *}; M=${SOF##* }
          if [ -z "$SOF" ]; then echo "не мога да определя софийския час — не будя"; exit 0; fi
          echo "София: $H:$M"
          case "$H" in 05|07|09|12|15|18|21) ;; *) echo "не е целеви час ($H:$M София)"; exit 0;; esac
          if [ "$H" = "21" ] && [ "$M" -lt 30 ]; then echo "21ч, но преди :30"; exit 0; fi
          LAST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/audit.yml/runs?per_page=1" \
            | grep -o '"created_at": *"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          echo "последен одит: ${LAST:-няма}"
          if [ -n "$LAST" ]; then
            AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 60 ))
            echo "възраст: ${AGE} мин"
            if [ "$AGE" -lt 50 ]; then echo "бягал е преди ${AGE} мин — не го будя"; exit 0; fi
          fi
          echo "будя одит-робота (${H}:${M} София)"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/audit.yml/dispatches" \
            -d '{"ref":"main"}' -w "HTTP %{http_code}\n"
      - name: alarm on barrier failure                    # защита срещу ТИХ престой (selftest/зависимост счупени)
        # ОДИТ-19: ЗАГЛУШАВАНЕ. Съобщение само ако и предишните два ръна са паднали.
        # Едно мигване не е новина; три поредни са. Дотук стреляше на всяко падане —
        # при трайна дреболия 12 червени съобщения на час.
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003827523037"
        run: |
          # ОДИТ-21 · ЕДИНСТВЕНОТО техническо съобщение, което остава.
          # Праща се САМО ако ботът мълчи достатъчно дълго, че да пропусне сделки:
          # 6 поредни падания × 5 минути = 30 минути тишина. Всяко пускане вече
          # опитва по 3 пъти вътрешно, значи това са 18 неуспешни опита.
          # О7 · СТРЕЛЯ САМО НА ПРЕХОДА, не при всеки рън.
          # Дотук: щом веднъж се навъртят 5 падания, ВСЕКИ следващ рън също вижда
          # 5-6 и алармата излиза на всеки 5 минути до края на епизода.
          # Сега: 5+ от ПОСЛЕДНИТЕ 6 паднали И под 5 от ПРЕДХОДНИТЕ 6 → един
          # сигнал на епизод, без да се пази състояние никъде.
          # 🔴 25.08 · ТРИ ДЕФЕКТА В ТАЗИ АЛАРМА, всичките мерени от живото Actions.
          #
          # 1 · СТРЕЛЯШЕ САМО НА ПРЕХОДА. «5+ от последните 6 И под 5 от
          #     предходните 6» значи: щом престоят продължи, PREV също става 5+
          #     и алармата МЛЪКВА. ИЗМЕРЕНО: на 24.08 паднаха 215 от 223 ръна —
          #     ЦЯЛ ТЪРГОВСКИ ДЕН — и собственикът получи най-много ЕДНО
          #     съобщение в началото. Пазач срещу фалшива тревога, който създаде
          #     ПРОПУСНАТА. Трети път, когато този шаблон ме бие.
          #
          # 2 · САМАТА АЛАРМА ГЪРМЕШЕ. `CONCL=$(curl | grep -o ...)` беше без
          #     `|| true`, а обвивката тук е `bash -eo pipefail`. Върне ли API
          #     `"conclusion":null` (рън в ход — БЕЗ кавички, не съвпада), grep
          #     излиза с 1 и УБИВА стъпката. В Actions се вижда като
          #     «alarm on barrier failure → failure».
          #
          # 3 · НЕ КАЗВАШЕ КОЕ Е СПРЯЛО БОТА. «Не успявам да тръгна» не
          #     разграничава «мрежата падна» от «моят selftest блокира бота».
          #     На 24.08 беше второто и никой не разбра.
          #
          # СЕГА: брои НЕПРЕКЪСНАТАТА поредица падания и стреля на СТЪПАЛА —
          # 6 (30 мин), 24 (2ч), 48 (4ч), 96 (8ч), 192 (16ч), 288 (24ч).
          # Един сигнал на стъпало: без спам, но и без мълчание при дълъг престой.
          CONCL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/aero-bot.yml/runs?status=completed&per_page=100" \
            | grep -o '"conclusion":"[a-z]*"' || true)
          STREAK=0
          for c in $CONCL; do
            case "$c" in *failure*) STREAK=$((STREAK+1));; *) break;; esac
          done
          # текущият рън още не е в списъка (той е «in_progress») → брои се тук
          STREAK=$((STREAK+1))
          # коя СТЪПКА е спряла бота — разликата между «мрежа» и «мой тест»
          KOJ="нещо в пускането"
          if [ "${{ steps.selftest_gate.outcome }}" = "failure" ]; then
            KOJ="СОБСТВЕНИЯТ МИ selftest — кодът е спрян нарочно, не е мрежа"
          elif [ "${{ steps.run_bot.outcome }}" = "failure" ]; then
            KOJ="самото пускане (мрежа/фийд) след 3 опита"
          fi
          echo "непрекъсната поредица падания: $STREAK · спряло от: $KOJ"
          # 🔴🔴 03.09 · ВЕРИГАТА НЕ ВИЖДА НАКЪСАНАТА СМЪРТ.
          # Горният брояч спира на първото НЕпадане (`*) break`). Значи хваща
          # само непрекъснат престой. А на 02-03.09 ботът гърмеше ПРЕЗ РЕД:
          # 141 от 316 ръна за 24 часа (45%) не стигнаха до дневника, между тях
          # три цели часа по 12/12 мъртви — и веригата НИТО ВЕДНЪЖ не стигна 6,
          # защото минаващите рънове я нулираха. Четиринайсет часа счупен бот,
          # нула тревоги, а отвън изглеждаше жив: commit на всеки 5 минути.
          # Затова тук се брои и РАВНОСМЕТКА: колко падания има в ТЕКУЩАТА
          # шестчасова кофа. Кофата е ФИКСИРАНА (не пълзяща) и затова броят в
          # нея само расте — «точно 12» се пали РОВНО ВЕДНЪЖ на кофа, без да
          # има нужда от памет между рънове. Максимум 4 съобщения на ден, и то
          # само докато ботът наистина е счупен; при здрав бот — нула.
          # 12 падания за 6 часа е ~17% от ~72 ръна. Здрав ден дава 0-2 (мрежа).
          # ПЪТ НАЗАД: махане на блока `RATE` и на `$RATE` от условието SEND.
          RATE=0
          if command -v jq >/dev/null 2>&1; then
            KOFA=$(( $(date -u +%s) / 21600 * 21600 ))
            OT=$(date -u -d "@${KOFA}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "")
            if [ -n "$OT" ]; then
              RATE=$(curl -s -H "Authorization: Bearer ${{ github.token }}"                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/aero-bot.yml/runs?status=completed&per_page=100"                 | jq --arg c "$OT" '[.workflow_runs[]
                    | select(.created_at >= $c)
                    | select(.conclusion=="failure")] | length' 2>/dev/null || echo 0)
            fi
          fi
          RATE=${RATE:-0}
          echo "падания в текущата 6-часова кофа: $RATE"
          # 🔴🔴🔴 05.09 · ПЕТ ПАДАНИЯ СА ПОД ПРАГА — И ТОВА Е ДУПКА.
          # Днес ботът падна 5 пъти подред (10:02-10:20 UTC, 23 минути тишина,
          # нула карти) заради ЕДИН НИЗ: `VERSION` изостана от темата на
          # комита, П47 го хвана, гейтът спря бота. Собственикът НЕ получи
          # нищо, защото първото стъпало е 6 (=30 мин).
          #
          # РАЗЛИКАТА, КОЯТО ТРЕВОГАТА ВЕЧЕ СМЯТА, НО НЕ ПОЛЗВАШЕ:
          #   падане на МРЕЖА/фийд може да се самоизлекува на следващия рън;
          #   падане на СОБСТВЕНИЯ selftest е ДЕТЕРМИНИСТИЧНО — същият код,
          #   същият тест, същият резултат. То НЯМА да мине само НИКОГА.
          # Тоест чакането на 30 минути при selftest не пази от фалшива
          # тревога — то само отлага НЕИЗБЕЖНАТА. Два поредни са достатъчни,
          # за да се изключи «мигване», и са 10 минути вместо 30.
          # ПЪТ НАЗАД: махане на блока `if ... selftest_gate` отдолу.
          STEPALA="6 24 48 96 192 288"
          if [ "${{ steps.selftest_gate.outcome }}" = "failure" ]; then
            STEPALA="2 6 24 48 96 192 288"
          fi
          # и КОЯ проверка пада — от запазения изход, не от Actions лога
          KOE=""
          if [ -f selftest_izhod.txt ]; then
            KOE=$(grep -m1 'SELFTEST FAIL' selftest_izhod.txt | cut -c1-220 || true)
          fi
          SEND=0
          for T in $STEPALA; do
            [ "$STREAK" = "$T" ] && SEND=1
          done
          if [ "$RATE" = "12" ]; then SEND=2; fi
          # 🔴 15.09 · ПУБЛИЧЕН КАНАЛ (vars.PUBLIC_CHANNEL=1): каналът е за всички и в
          # него излиза САМО сутрешната прогноза — тревогата НЕ отива там. Остава
          # червеният рън в Actions. НАЗАД: PUBLIC_CHANNEL=0.
          if [ "${{ vars.PUBLIC_CHANNEL }}" = "1" ] && [ "$SEND" != "0" ]; then
            echo "::warning::публичен канал — тревогата НЕ се праща в Телеграм (поредица $STREAK · $KOJ)"
            SEND=0
          fi
          if [ "$SEND" = "2" ]; then
            # накъсаната смърт: между паданията ИМА минаващи рънове, затова
            # «тих съм от N минути» би било невярно. Казва се това, което е.
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"               -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML               -d text="🔕 <b>Гърмя през ред — ${RATE} пъти за 6 часа</b>%0A<i>${KOJ}.</i>%0A<i>Между паданията минавам, затова изглеждам жив. Пропускам сигнали. Обаждам се веднъж на 6 часа, докато трае.</i>" || true
            echo "::warning::пратено съобщение за НАКЪСАН престой ($RATE за 6ч · $KOJ)"
          elif [ "$SEND" = "1" ]; then
            MIN=$((STREAK*5))
            # 🔴 05.09 · КАЗВА КОЯ ПРОВЕРКА. «Нещо се счупи» струва толкова,
            # колкото мълчанието: и в двата случая никой не знае какво да
            # прави. При selftest се добавя редът с падналите проверки и се
            # казва изрично, че това НЯМА да мине само.
            OSHTE=""
            if [ -n "$KOE" ]; then
              OSHTE="%0A<code>${KOE}</code>%0A<i>Това е мой тест — няма да мине само.</i>"
            fi
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML \
              -d text="🔕 <b>Тих съм вече ${MIN} минути</b>%0A<i>${KOJ}.</i>${OSHTE}%0A<i>Толкова време без пускане значи пропуснати сигнали. Продължавам да опитвам на всеки 5 минути и ще се обадя пак, ако не тръгна.</i>" || true
            echo "::warning::пратено съобщение за престой от ${MIN} мин ($KOJ)"
          else
            echo "::notice::поредица $STREAK — под следващото стъпало, пробвам пак"
          fi
          exit 0
