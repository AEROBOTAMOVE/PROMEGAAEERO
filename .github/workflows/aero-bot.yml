name: AERO Gold Bot
on:
  # 🔴🔴 03.09 · СПУСЪКЪТ `push` Е МАХНАТ — ТОЙ УСПИВАШЕ БОТА.
  # ПРЕБРОЕНО в live_journal.jsonl: 7 дупки над 20 минути за 02-03.09, от които
  # 4 СЪДЪРЖАТ мое качване:
  #     19:12→20:12 (60м) · 20:12→22:12 (120м) · 04:11→06:13 (122м) · 06:13→08:13 (120м)
  # МЕХАНИЗМЪТ: `concurrency: group: aero-bot` е ЕДНА опашка за всички спусъци.
  # GitHub пази САМО ЕДИН чакащ рън на група — щом моят push-рън заеме мястото,
  # разписаните пристигащи се ИЗХВЪРЛЯТ. А push-рънът върти целия selftest
  # (2750 проверки, ~70с) плюс бота, тоест държи групата минути наред.
  # 27 качвания за два дни = 27 такива прозореца.
  # ЗАЩО МАХАНЕТО НЕ СТРУВА НИЩО: разписанието е на 5 минути през деня и на
  # 15 през нощта — нова версия влиза САМА до 5 минути. Спусъкът даваше само
  # «веднага», а плащаше с изхвърлени ръна.
  # ПЪТ НАЗАД: връщане на блока `push:` отдолу (пази се дословно):
  #   push:
  #     branches: [main]
  #     paths: ['live_bot.py', 'backtest_stats.json', 'requirements.txt',
  #             'weekly_context.json', 'daily_context.json']
  # За «веднага» има `workflow_dispatch` — един бутон, без опашка.
  workflow_dispatch:
    inputs:
      status:
        description: 'Прати статус-карта (какво е положението)? yes/no'
        required: false
        default: 'no'
  schedule:
    - cron: '*/5 5-21 * * 1-5'      # ден: на 5 мин (публично repo = безплатно)
    - cron: '*/10 22,23 * * 0-5'    # нощ + неделно отваряне: на 10 мин
    - cron: '*/15 0-4 * * 1-5'      # дълбока нощ: на 15 мин
permissions:
  contents: write
  actions: write            # ОДИТ-6: ботът буди одит-робота (GitHub cron-ът го изпуска)
concurrency:
  group: aero-bot
  cancel-in-progress: false
jobs:
  signal:
    runs-on: ubuntu-latest
    # 🔴🔴 23.09 · МЕРЕНО НА ЖИВО: стъпка с `if: ${{ vars.X != '0' }}` се ПРОПУСКА
    # в това хранилище — «sync to tip» е skipped във ВСЕКИ рън от 22.09, а трите
    # стъпки на кеша — от качването на v18.89 (проверено в jobs API: conclusion
    # "skipped", при положение че такава променлива изобщо няма). Тоест контекстът
    # `vars` не стига до УСЛОВИЯТА при workflow_dispatch тук. Затова стойностите се
    # вземат ВЕДНЪЖ в `env` (там работят — така се подават и лостовете на бота), а
    # условията четат `env`. Празно env = включено, както беше замислено.
    env:
      CHECKOUT_TIP: ${{ vars.CHECKOUT_TIP || '' }}
      SELFTEST_CACHE: ${{ vars.SELFTEST_CACHE || '' }}
    steps:
      - uses: actions/checkout@v4
        # 🔴🔴 22.09 · v18.88 · ЗАСТОЯЛ РЪН. Без `ref` checkout тегли SHA-то от
        # СЪЗДАВАНЕТО на рънa. Рън, чакал в concurrency групата зад друг, чете
        # състоянието ОТПРЕДИ state-комита на предишния (open_trade, last_sent,
        # meta), може да прати пак изход, а записът му пада 3 от 3 на rebase
        # (проверяващият на «състоянието»: 41 от 2153 рънa за 7.3 дни). СЕГА се
        # тегли върхът на main в мига на старта. НАЗАД: CHECKOUT_TIP=0 (github.sha).
        # 🔴 22.09 · v18.88a · `ref: main` остави рънa БЕЗ КЛОН (detached HEAD) → save state
        # падаше «You are not currently on a branch» 3 от 3 и състоянието НЕ се записваше.
        # Затова checkout е пак по подразбиране (на клона main), а към върха се стига
        # със следващата стъпка (--ff-only: само напред, никога не пренаписва).
      - name: sync to tip
        if: ${{ env.CHECKOUT_TIP != '0' }}
        run: |
          git fetch -q origin main && git merge -q --ff-only origin/main || echo "::warning::sync to tip не успя — продължавам от събитието"
          git rev-parse --abbrev-ref HEAD
          git log --oneline -1
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: версия                                    # О10: коя версия работи — да се вижда в лога
        run: |
          python -c "import re,io;print('AERO', re.search(r'VERSION = \"([^\"]+)\"', io.open('live_bot.py',encoding='utf-8').read()).group(1))"
          git log --oneline -1
          echo "vars до условията: cache=[${{ vars.SELFTEST_CACHE }}] tip=[${{ vars.CHECKOUT_TIP }}] nochase=[${{ vars.NO_CHASE }}]"
      # 🔴🔴 22.09 · v18.89 · ГЕЙТЪТ ЧАКАШЕ ЕДНО И СЪЩО. Стъпката «selftest gate»
      # стигна 317 с ПРЕДИ ВСЕКИ рън (беше ~150 с), а ботът върви на 5 минути —
      # сигналите излизаха ~5 минути късно. Селфтестът НЕ е напълно детерминистичен:
      # 16 от 23 стенда пускат main() по ИСТИНСКИЯ часовник. Затова кешът важи само
      # за ЕДИН UTC ден, а живата част (часовникът) се пуска при ВСЕКИ рън. Затова: щом ТОЧНО този код (хеш на всички .py,
      # brain/**, yml-ите, requirements и данните, които тестовете четат — БЕЗ
      # live/, което се мени всеки рън) ВЕЧЕ е минал ЦЕЛИЯ selftest ЗЕЛЕН, той не
      # се пуска пак; пуска се само живата част (`selftest_zhivo.py`: версията
      # срещу последния комит + един истински main() по ИСТИНСКИЯ часовник).
      # В ключа влиза и ДАТАТА (UTC) — всеки нов ден първият рън пуска ЦЕЛИЯ
      # тест, за да не може проверка, зависеща от календара, да се скрие зад кеша.
      # БЕЛЕГЪТ СЕ ЗАПИСВА САМО СЛЕД ЗЕЛЕН ПЪЛЕН РЪН (виж `full=1` отдолу), а
      # ключът е ТОЧЕН (без restore-keys) и съдържанието му се сверява с ключа —
      # червен selftest не може да се скрие зад кеша.
      # НАЗАД: vars.SELFTEST_CACHE=0 → всеки рън пуска целия selftest, както досега.
      # 24.09 · platforma/** (снимките на четците на платформата, .mjs/.js) е в ключа:
      # смени ли се снимка, П196 10 трябва да се пусне пак, не да се скрие зад кеша.
      - name: selftest ключ
        id: st_key
        if: ${{ env.SELFTEST_CACHE != '0' }}
        continue-on-error: true            # празен ключ води към ПЪЛНИЯ тест — стъпката не бива да вали рънa
        run: |
          echo "key=selftest-v1-$(date -u +%Y-%m-%d)-py${{ steps.py.outputs.python-version }}-${{ hashFiles('**/*.py', 'brain/**', '.github/workflows/*.yml', 'requirements.txt', '*.json', '*.md', '*.txt', '*.pine', 'tradingview/**', 'platforma/**') }}" >> "$GITHUB_OUTPUT"
      - name: selftest кеш · четене
        id: st_cache
        if: ${{ env.SELFTEST_CACHE != '0' && steps.st_key.outputs.key != '' }}
        continue-on-error: true            # кешът НИКОГА не бива да вали рънa
        uses: actions/cache/restore@v4
        with:
          path: .selftest_ok
          key: ${{ steps.st_key.outputs.key }}
      - name: selftest gate                             # W1: счупен код НЕ праща сигнали
        id: selftest_gate
        shell: bash                        # ← `bash -eo pipefail`: падне ли python, пада и стъпката ПРЕЗ `tee`
        # 🔴 25.08 · таванът беше 5 мин. МЕРЕНО от живото Actions: стъпката трае
        # 59-71с и при падане, И при минаване — тоест НЕ Е таймаут, а истински
        # провал на тест. Таванът се вдига все пак: селфтестът расте с всеки нов
        # тест и един ден ще опре в него ТИХО, а тих таван спира бота за цял ден.
        timeout-minutes: 12
        # 🔴 05.09 · ИЗХОДЪТ СЕ ЗАПАЗВА. Днес ботът стоя 23 минути и за да
        # разбера КОЯ проверка пада, трябваше да сваля лога през Actions API
        # — а той е недостъпен отвън за собственика. Тревогата отдолу чете
        # този файл и НАЗОВАВА проверката, вместо да казва «нещо се счупи».
        # `tee` не мени изхода: обвивката е `bash -eo pipefail`, тоест кодът
        # на python се разпространява през тръбата (проверено в П154).
        env:
          SELFTEST_CACHE: ${{ vars.SELFTEST_CACHE || '' }}
          ST_KEY: ${{ steps.st_key.outputs.key }}
          ST_HIT: ${{ steps.st_cache.outputs.cache-hit }}
        run: |
          set -eo pipefail   # -e: падне ли python, пада и стъпката; -o pipefail: и през tee
          if [ "${SELFTEST_CACHE:-1}" != "0" ] && [ "$ST_HIT" = "true" ] && [ -n "$ST_KEY" ] \
             && [ -f .selftest_ok ] && [ "$(head -n 1 .selftest_ok)" = "$ST_KEY" ]; then
            echo "full=0" >> "$GITHUB_OUTPUT"
            echo "::notice::selftest: СЪЩИЯТ код вече мина ЦЕЛИЯ selftest зелен — пускам само живата част"
            python selftest_zhivo.py 2>&1 | tee selftest_izhod.txt
          else
            echo "full=1" >> "$GITHUB_OUTPUT"
            rm -f .selftest_ok
            python selftest.py 2>&1 | tee selftest_izhod.txt
            if [ -n "$ST_KEY" ]; then printf '%s\n' "$ST_KEY" > .selftest_ok; fi
          fi
      - name: selftest кеш · запис                      # САМО след ЗЕЛЕН ПЪЛЕН рън
        if: ${{ env.SELFTEST_CACHE != '0' && steps.selftest_gate.outputs.full == '1' && steps.st_key.outputs.key != '' }}
        continue-on-error: true            # зает ключ (друг рън) е предупреждение, не провал
        uses: actions/cache/save@v4
        with:
          path: .selftest_ok
          key: ${{ steps.st_key.outputs.key }}
      - name: run bot
        id: run_bot
        # 🔴 ОДИТ-5: без таван един увиснал yfinance-разговор държи concurrency групата
        # «aero-bot» и GitHub ОТМЕНЯ наредените следващи рънове. Мерено в живия дневник:
        # 35-минутна дупка на 24.07 16:01→16:36 UTC, в средата на нюйоркската сесия,
        # делник, три */5 слота изчезнали. Нормалният рън е ~40 секунди.
        timeout-minutes: 8
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003827523037"
          BALANCE: ${{ vars.BALANCE || '1000' }}
          RISK_PCT: ${{ vars.RISK_PCT || '2' }}
          STATUS_CARD: ${{ github.event.inputs.status || 'no' }}

          # 🔴 02.09 · РЪЧКИТЕ С «ПЪТ НАЗАД БЕЗ КАЧВАНЕ» най-после стигат до

          # бота. Всяка идва от Settings → Variables; празно = подразбирането

          # в кода (`_env` третира празното като липсващо). Смяна на

          # поведението = една стойност в Variables, БЕЗ комит.

          ЛОНГ_СТОП_ПИПСА: ${{ vars.LONG_STOP_PIPS || '' }}

          ГЕЙТ_ЛОНГ_НЕДОКАЗАНО: ${{ vars.GATE_LONG_UNPROVEN || '' }}
          ГЕЙТ_ШОРТ_НЕДОКАЗАНО: ${{ vars.GATE_SHORT_UNPROVEN || '' }}
          РАМКИ_СВОИ_ЛИНИИ: ${{ vars.FRAME_OWN_REFS || '' }}
          КРАЙ_ДОПУСК_ДЯЛ: ${{ vars.EDGE_TOL_FRAC || '' }}
          COOL_MIN: ${{ vars.COOL_MIN || '' }}
          COOL_FLIP_MIN: ${{ vars.COOL_FLIP_MIN || '' }}
          ВХОД_ТЕКСТ_ЗНАЦИ: ${{ vars.POST_TEXT_CHARS || '' }}
          РАМКА_МИН_БАРОВЕ: ${{ vars.FRAME_MIN_BARS || '' }}
          НОВИНИ_КОТВА_NY: ${{ vars.NEWS_ANCHOR_NY || '' }}
          НОВИНИ_ПРЕДИ_Ч: ${{ vars.NEWS_AHEAD_H || '' }}
          НОВИНИ_ЕТАПИ: ${{ vars.NEWS_STAGES || '' }}
          СУТРИН_ОТ: ${{ vars.MORNING_FROM || '' }}
          СУТРИН_ДО: ${{ vars.MORNING_TO || '' }}
          ГОЛЯМ_ХОД_ПРОЦЕНТИЛ: ${{ vars.BIG_DXY_PCTL || '' }}
          НОВИНИ_ИЗТОЧНИК: ${{ vars.NEWS_SOURCE || '' }}
          NASDAQ_ДНИ: ${{ vars.NASDAQ_DAYS || '' }}
          NASDAQ_БЮДЖЕТ_С: ${{ vars.NASDAQ_BUDGET_S || '' }}
          МАКРО_ИМЕНА_EN: ${{ vars.MACRO_NAMES_EN || '' }}
          МАКРО_ИМЕНА_ПРЕСКОК: ${{ vars.MACRO_NAMES_SKIP || '' }}
          КРИТИЧНИ_ИМЕНА: ${{ vars.MACRO_NAMES_CRITICAL || '' }}
          NASDAQ_ПРАЗНИ_ТРЕВОГА: ${{ vars.NASDAQ_EMPTY_ALARM || '' }}
          ПРОГНОЗА_К_ДЕН: ${{ vars.FORECAST_K_DAY || '' }}
          ОБЗОР_ЗНАЦИ: ${{ vars.OVERVIEW_CHARS || '' }}
          ОБЗОР_РЕДОВЕ: ${{ vars.OVERVIEW_LINES || '' }}
          ПРОГНОЗА_К_СЕДМИЦА: ${{ vars.FORECAST_K_WEEK || '' }}
          КАРТА_РЕДОВЕ: ${{ vars.CARD_LINES || '' }}
          СПРЕД_ТАВАН_ПИПСА: ${{ vars.SPREAD_CAP_PIPS || '' }}
          КАРТА_ЗНАЦИ: ${{ vars.CARD_CHARS || '' }}
          КАРТА_ПЪРВИ_РЕД: ${{ vars.CARD_FIRST_LINE || '' }}
          ПУЛС_СЛОТОВЕ: ${{ vars.PULSE_SLOTS || '' }}

          МАЛЪК_РАЗМЕР_W: ${{ vars.SMALL_SIZE_W || '' }}

          РЕЖИМ_W_ПОД: ${{ vars.REGIME_W_BELOW || '' }}

          ЛОНГ_САМО_НАД_SMA200: ${{ vars.LONG_ONLY_ABOVE_SMA200 || '' }}

          БЕЗ_ЛОНГ_ПЕТЪК: ${{ vars.NO_LONG_FRIDAY || '' }}

          ШОРТ_ГЕОМЕТРИЯ: ${{ vars.SHORT_GEOMETRY || '' }}

          МИН_ДНИ: ${{ vars.MIN_DAYS || '' }}
          ПРАГ_ДНИ_ЗАБРАНА: ${{ vars.DAYS_FLOOR_BLOCKS || '' }}
          ЗАПОВЕД_ИЗХОД: ${{ vars.EXIT_ORDER || '' }}
          ПОСОКА_ОТ_ЦЕНАТА: ${{ vars.DIR_FROM_PRICE || '' }}
          МОЗЪК_СЛОТОВЕ: ${{ vars.BRAIN_SLOTS || '' }}
          ПРЕМИУМ_ПО_ТОЧКИ: ${{ vars.PREMIUM_BY_SCORE || '' }}
          ПРЕМИУМ_ТОЧКИ: ${{ vars.PREMIUM_SCORE || '' }}
          ГЕЙТ_МИН_ТОЧКИ: ${{ vars.GATE_MIN_SCORE || '' }}
          ТАВАН_ВХОД_ДЕН: ${{ vars.MAX_ENTRIES_DAY || '' }}
          # 🔴 03.09 · петте, които четяха от средата, но НЯМАХА път до yml —
          # тоест обещанието «път назад без качване» беше счупено за тях.
          ЗАПОВЕД_НА_КАРТАТА: ${{ vars.CARD_ORDER || '' }}
          РАЗМЕР_ЧИСЛА: ${{ vars.SIZE_NUMBERS || '' }}
          СПРЯНА_ПАУЗА_КАРТА: ${{ vars.PAUSED_CARD || '' }}
          СЯНКА_ДВА_РЕДА: ${{ vars.SHADOW_TWO_LINES || '' }}
          ЧАС_ИЗТОЧНИК: ${{ vars.HOUR_SOURCE || '' }}
          ПАЗАЧ: ${{ vars.GUARD || '' }}
          ПАЗАЧ_СТОПОВЕ: ${{ vars.GUARD_STOPS || '' }}
          ПАЗАЧ_ПРОЗОРЕЦ_Ч: ${{ vars.GUARD_WINDOW_H || '' }}
          # 🔴 08.09 · РЪЧКИТЕ НА МОЗЪКА И НА ДНЕВНИЯ АНАЛИЗ. Всяка чете през
          # `_env`, тоест празно тук значи «остави подразбирането в кода».
          # ЗАЩО ГИ ИМА: кодът обещава «път назад без качване»; ръчка, която
          # yml-ът не подава, прави обещанието празно.
          МОЗЪК_РАМКИ: ${{ vars.BRAIN_FRAMES || '' }}            # назад: 1мин,5м,15м
          МОЗЪК_ХОР_БАРОВЕ: ${{ vars.BRAIN_HORIZON_BARS || '' }}  # назад: 0
          МОЗЪК_РАЗРЕД_ГЛОБАЛЕН: ${{ vars.BRAIN_COOLDOWN_GLOBAL || '' }}  # назад: 1
          МОЗЪК_РАЗРЕД_ПОД: ${{ vars.BRAIN_COOLDOWN_FLOOR || '' }}
          ЧАСОВА_СЕРИЯ: ${{ vars.HOURLY_SERIES || '' }}          # назад: 0
          # прочетен таймаут вече НЕ значи «не е пратено». Назад: 1
          ТЕЛЕГРАМ_ТАЙМАУТ: ${{ vars.TELEGRAM_TIMEOUT || '' }}   # назад: 15
          ТАЙМАУТ_Е_ПРОВАЛ: ${{ vars.TIMEOUT_IS_FAIL || '' }}    # назад: 1
          # 🔴 «СИЛНА ПРОДАЖБА» става възможна. МЕНИ РАЗМЕРА. Назад: не
          КЛАС_ПО_ВЪЗМОЖНОТО: ${{ vars.TIER_BY_POSSIBLE || '' }}
          # дневният пояс: център = живата цена, ширина по измерен квантил
          ПРОГНОЗА_ПО_ХОД: ${{ vars.FORECAST_BY_MOVE || '' }}    # назад: 0
          ПРОГНОЗА_ДЯЛ: ${{ vars.FORECAST_SHARE || '' }}
          ПРОГНОЗА_ПРОЗОРЕЦ: ${{ vars.FORECAST_WINDOW || '' }}
          ПРОГНОЗА_НАКЛОН: ${{ vars.FORECAST_SLOPE || '' }}      # =1 връща стария ред
          # 🔴 08.09 · СКАЛП · картите по рамки стават ИСТИНСКИ входове.
          # Назад: SCALP=не (пак стават «гледай натам»).
          СКАЛП: ${{ vars.SCALP || '' }}
          СКАЛП_ЦЕЛ1: ${{ vars.SCALP_TP1 || '' }}                # кратно на риска · 0 = структурни цели
          СКАЛП_ЦЕЛ2: ${{ vars.SCALP_TP2 || '' }}
          # 🔴 08.09 · ВКАМЕНЕНА СВЕЩ · над този таван НЕ се отварят входове.
          # 07.09: 289 руна върху ЕДНА свещ отпреди петък (67 ч), 19 сигнала.
          # Назад: BAR_MAX_AGE = 0 (спирачката пада).
          БАР_ТАВАН_МИН: ${{ vars.BAR_MAX_AGE || '' }}
          # 🔴🔴🔴 08.09 · СЛЕДЕНЕТО ВИЖДА МИНУТИ, НЕ ДЕСЕТ МИНУТИ.
          # ПОВОД: собственикът — «бота даде шорта, не прибра, а беше
          # стигнало прибиране на 4390, после вика че е стопа ударен».
          # МЕРЕНО на 08.09: шорт #2 (вход 4394.21, стоп 4407.21) минава
          # стопа си в 10:20; ботът го затвори в 11:37 — 1ч 17м по-късно.
          # ПРИЧИНАТА: между два рънa се виждаше САМО една точка спот, а
          # 5-минутните барове са ФЮЧЪРСНИ, изостават 10-15 мин и минават
          # през базис със стд. отклонение 2.17$ (13.11$ за три дни с
          # роловъра) при стоп 13$ и първа цел 5$.
          # ЛЕКЪТ: минутен път от PAXG (една тройунция злато на токен),
          # Kraken → Coinbase → Binance. Мерено на 440 двойки: 6× по-точно
          # отместване и закъснение 1 мин вместо 10.
          # НАЗАД: GOLD_PATH=0 → пак само фючърсните барове.
          # 🔴 08.09 · БРЕЙК ИВЪН Е ЧИСТА НУЛА. Стопът е ПОЧИВАЩА
          # поръчка и се пълни на НИВОТО, не там, докъдето цената е
          # стигнала, докато ботът не е гледал. Живо: вход 4439.47,
          # стоп на входа, отчетено −51 пипса, които не са се случили.
          # НАЗАД: STOP_FILL_LEVEL=0.
          # 🔴 08.09 · НАБЛЮДЕНИЕТО СПАЗВА СЪЩОТО ПРАВИЛО КАТО СДЕЛКАТА:
