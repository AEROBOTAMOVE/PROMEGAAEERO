name: AERO Gold Bot
on:
  push:
    branches: [main]                                    # W3: само main
    paths: ['live_bot.py', 'backtest_stats.json', 'requirements.txt',
            'weekly_context.json', 'daily_context.json']   # W3: не се пали от README/docs
  workflow_dispatch:
    inputs:
      status:
        description: 'Прати статус-карта (какво е положението)? yes/no'
        required: false
        default: 'no'
  schedule:
    - cron: '*/5 5-21 * * 1-5'      # ден: на 5 мин (публично repo = безплатно)
    - cron: '*/10 22,23 * * 0-5'    # нощ + неделно отваряне: на 10 мин
    - cron: '*/15 0-4 * * 1-5'      # дълбока нощ: на 15 мин
permissions:
  contents: write
  actions: write            # ОДИТ-6: ботът буди одит-робота (GitHub cron-ът го изпуска)
concurrency:
  group: aero-bot
  cancel-in-progress: false
jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: версия                                    # О10: коя версия работи — да се вижда в лога
        run: |
          python -c "import re,io;print('AERO', re.search(r'VERSION = \"([^\"]+)\"', io.open('live_bot.py',encoding='utf-8').read()).group(1))"
          git log --oneline -1
      - name: selftest gate                             # W1: счупен код НЕ праща сигнали
        id: selftest_gate
        # 🔴 25.08 · таванът беше 5 мин. МЕРЕНО от живото Actions: стъпката трае
        # 59-71с и при падане, И при минаване — тоест НЕ Е таймаут, а истински
        # провал на тест. Таванът се вдига все пак: селфтестът расте с всеки нов
        # тест и един ден ще опре в него ТИХО, а тих таван спира бота за цял ден.
        timeout-minutes: 12
        run: python selftest.py
      - name: run bot
        id: run_bot
        # 🔴 ОДИТ-5: без таван един увиснал yfinance-разговор държи concurrency групата
        # «aero-bot» и GitHub ОТМЕНЯ наредените следващи рънове. Мерено в живия дневник:
        # 35-минутна дупка на 24.07 16:01→16:36 UTC, в средата на нюйоркската сесия,
        # делник, три */5 слота изчезнали. Нормалният рън е ~40 секунди.
        timeout-minutes: 8
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003827523037"
          BALANCE: ${{ vars.BALANCE || '1000' }}
          RISK_PCT: ${{ vars.RISK_PCT || '2' }}
          STATUS_CARD: ${{ github.event.inputs.status || 'no' }}
          # 🔴 02.09 · РЪЧКИТЕ С «ПЪТ НАЗАД БЕЗ КАЧВАНЕ» най-после стигат до
          # бота. Всяка идва от Settings → Variables; празно = подразбирането
          # в кода (`_env` третира празното като липсващо). Смяна на
          # поведението = една стойност в Variables, БЕЗ комит.
          ЛОНГ_СТОП_ПИПСА: ${{ vars.LONG_STOP_PIPS || '' }}
          ГЕЙТ_ЛОНГ_НЕДОКАЗАНО: ${{ vars.GATE_LONG_UNPROVEN || '' }}
          МАЛЪК_РАЗМЕР_W: ${{ vars.SMALL_SIZE_W || '' }}
          РЕЖИМ_W_ПОД: ${{ vars.REGIME_W_BELOW || '' }}
          ЛОНГ_САМО_НАД_SMA200: ${{ vars.LONG_ONLY_ABOVE_SMA200 || '' }}
          БЕЗ_ЛОНГ_ПЕТЪК: ${{ vars.NO_LONG_FRIDAY || '' }}
          ШОРТ_ГЕОМЕТРИЯ: ${{ vars.SHORT_GEOMETRY || '' }}
          МИН_ДНИ: ${{ vars.MIN_DAYS || '' }}
          ЗАПОВЕД_ИЗХОД: ${{ vars.EXIT_ORDER || '' }}
        # ОДИТ-19 · СЪЖИВЯВАНЕ. Повечето падания са мигновени (мрежа, 429 от Yahoo,
        # бавен фийд). Дотук едно мигване вдигаше червена аларма. Сега се пробва ПАК.
        run: |
          for try_n in 1 2 3; do
            if python live_bot.py --send --stats backtest_stats.json --out live; then
              [ "$try_n" != "1" ] && echo "::notice::ботът тръгна от опит $try_n"
              exit 0
            fi
            echo "::warning::опит $try_n не мина — чакам 20с и пробвам пак"
            sleep 20
          done
          echo "::error::и трите опита паднаха"
          exit 1
      - name: save state
        if: always()
        timeout-minutes: 6          # ОДИТ-2 №4: ботът вече излиза с код 1 при краш —
                              # състоянието ТРЯБВА да се запише и тогава (иначе двойна карта)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003827523037"
        run: |
          git config user.name "aero-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A live/ || true
          git commit -m "state" || echo "nothing"
          ok=0
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && ok=1 && break
            echo "push опит $i неуспешен, чакам 5с"; sleep 5
          done
          if [ "$ok" != "1" ]; then
            # ОДИТ-21: БЕЗ СЪОБЩЕНИЕ. Собственикът не може да направи нищо по
            # неуспешен git push — това е мой проблем, не негов. Остава в лога;
            # одит-роботът и без това следи за двойни карти (М-групата).
            echo "::warning::PUSH FAILED - състоянието не се записа (без съобщение, по избор на собственика)"
          fi
      # ═══ ОДИТ-6: БУДИЛНИК ЗА ОДИТ-РОБОТА ═══
      # Мерено 04.08.2026 през API-то: одитът има 7 крона на ден, но реалните пускания
      # закъсняват +227, +108, +82 мин, а на 04.08 до обед НЕ Е СЕ ПУСНАЛ НИТО ВЕДНЪЖ.
      # Шест от седемте крона стоят на КРЪГЪЛ ЧАС — точно когато GitHub изхвърля
      # разписания. Ботът обаче тръгва надеждно (12/12 ръна). Затова ТОЙ го буди:
      # ако сме в целеви час по София и одитът не е бягал в последните 50 мин → dispatch.
      # Не пипа самия одит-робот; кроновете му остават като втори колан.
      - name: wake the audit robot
        if: always()
        continue-on-error: true          # будилникът НИКОГА не бива да вали сигналния рън
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # НЕ ползваме `TZ=Europe/Sofia date` — мерено: в среда без tzdata връща UTC
          # мълчаливо и будилникът щеше да стреля 3 часа по-рано. Ползваме СЪЩИЯ метод
          # като самия бот (zoneinfo), който доказано дава верния час на картите.
          SOF=$(python -c "from zoneinfo import ZoneInfo
          from datetime import datetime, timezone
          print(datetime.now(timezone.utc).astimezone(ZoneInfo('Europe/Sofia')).strftime('%H %M'))" 2>/dev/null || true)
          H=${SOF%% *}; M=${SOF##* }
          if [ -z "$SOF" ]; then echo "не мога да определя софийския час — не будя"; exit 0; fi
          echo "София: $H:$M"
          case "$H" in 05|07|09|12|15|18|21) ;; *) echo "не е целеви час ($H:$M София)"; exit 0;; esac
          if [ "$H" = "21" ] && [ "$M" -lt 30 ]; then echo "21ч, но преди :30"; exit 0; fi
          LAST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/audit.yml/runs?per_page=1" \
            | grep -o '"created_at": *"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          echo "последен одит: ${LAST:-няма}"
          if [ -n "$LAST" ]; then
            AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 60 ))
            echo "възраст: ${AGE} мин"
            if [ "$AGE" -lt 50 ]; then echo "бягал е преди ${AGE} мин — не го будя"; exit 0; fi
          fi
          echo "будя одит-робота (${H}:${M} София)"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/audit.yml/dispatches" \
            -d '{"ref":"main"}' -w "HTTP %{http_code}\n"
      - name: alarm on barrier failure                    # защита срещу ТИХ престой (selftest/зависимост счупени)
        # ОДИТ-19: ЗАГЛУШАВАНЕ. Съобщение само ако и предишните два ръна са паднали.
        # Едно мигване не е новина; три поредни са. Дотук стреляше на всяко падане —
        # при трайна дреболия 12 червени съобщения на час.
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003827523037"
        run: |
          # ОДИТ-21 · ЕДИНСТВЕНОТО техническо съобщение, което остава.
          # Праща се САМО ако ботът мълчи достатъчно дълго, че да пропусне сделки:
          # 6 поредни падания × 5 минути = 30 минути тишина. Всяко пускане вече
          # опитва по 3 пъти вътрешно, значи това са 18 неуспешни опита.
          # О7 · СТРЕЛЯ САМО НА ПРЕХОДА, не при всеки рън.
          # Дотук: щом веднъж се навъртят 5 падания, ВСЕКИ следващ рън също вижда
          # 5-6 и алармата излиза на всеки 5 минути до края на епизода.
          # Сега: 5+ от ПОСЛЕДНИТЕ 6 паднали И под 5 от ПРЕДХОДНИТЕ 6 → един
          # сигнал на епизод, без да се пази състояние никъде.
          # 🔴 25.08 · ТРИ ДЕФЕКТА В ТАЗИ АЛАРМА, всичките мерени от живото Actions.
          #
          # 1 · СТРЕЛЯШЕ САМО НА ПРЕХОДА. «5+ от последните 6 И под 5 от
          #     предходните 6» значи: щом престоят продължи, PREV също става 5+
          #     и алармата МЛЪКВА. ИЗМЕРЕНО: на 24.08 паднаха 215 от 223 ръна —
          #     ЦЯЛ ТЪРГОВСКИ ДЕН — и собственикът получи най-много ЕДНО
          #     съобщение в началото. Пазач срещу фалшива тревога, който създаде
          #     ПРОПУСНАТА. Трети път, когато този шаблон ме бие.
          #
          # 2 · САМАТА АЛАРМА ГЪРМЕШЕ. `CONCL=$(curl | grep -o ...)` беше без
          #     `|| true`, а обвивката тук е `bash -eo pipefail`. Върне ли API
          #     `"conclusion":null` (рън в ход — БЕЗ кавички, не съвпада), grep
          #     излиза с 1 и УБИВА стъпката. В Actions се вижда като
          #     «alarm on barrier failure → failure».
          #
          # 3 · НЕ КАЗВАШЕ КОЕ Е СПРЯЛО БОТА. «Не успявам да тръгна» не
          #     разграничава «мрежата падна» от «моят selftest блокира бота».
          #     На 24.08 беше второто и никой не разбра.
          #
          # СЕГА: брои НЕПРЕКЪСНАТАТА поредица падания и стреля на СТЪПАЛА —
          # 6 (30 мин), 24 (2ч), 48 (4ч), 96 (8ч), 192 (16ч), 288 (24ч).
          # Един сигнал на стъпало: без спам, но и без мълчание при дълъг престой.
          CONCL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/aero-bot.yml/runs?status=completed&per_page=100" \
            | grep -o '"conclusion":"[a-z]*"' || true)
          STREAK=0
          for c in $CONCL; do
            case "$c" in *failure*) STREAK=$((STREAK+1));; *) break;; esac
          done
          # текущият рън още не е в списъка (той е «in_progress») → брои се тук
          STREAK=$((STREAK+1))
          # коя СТЪПКА е спряла бота — разликата между «мрежа» и «мой тест»
          KOJ="нещо в пускането"
          if [ "${{ steps.selftest_gate.outcome }}" = "failure" ]; then
            KOJ="СОБСТВЕНИЯТ МИ selftest — кодът е спрян нарочно, не е мрежа"
          elif [ "${{ steps.run_bot.outcome }}" = "failure" ]; then
            KOJ="самото пускане (мрежа/фийд) след 3 опита"
          fi
          echo "непрекъсната поредица падания: $STREAK · спряло от: $KOJ"
          SEND=0
          for T in 6 24 48 96 192 288; do
            [ "$STREAK" = "$T" ] && SEND=1
          done
          if [ "$SEND" = "1" ]; then
            MIN=$((STREAK*5))
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML \
              -d text="🔕 <b>Тих съм вече ${MIN} минути</b>%0A<i>${KOJ}.</i>%0A<i>Толкова време без пускане значи пропуснати сигнали. Продължавам да опитвам на всеки 5 минути и ще се обадя пак, ако не тръгна.</i>" || true
            echo "::warning::пратено съобщение за престой от ${MIN} мин ($KOJ)"
          else
            echo "::notice::поредица $STREAK — под следващото стъпало, пробвам пак"
          fi
          exit 0
